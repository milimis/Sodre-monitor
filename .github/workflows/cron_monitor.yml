
name: Monitoreo Menciones Sodre

on:
  schedule:
    - cron: '0 0,12 * * *'

  workflow_dispatch:
    inputs:
      script_a_ejecutar:
        description: 'Selecciona la tarea'
        required: true
        default: 'monitoreo_diario'
        type: choice
        options:
          - monitoreo_diario
          - procesar_excel_2025
          - historico_2026
          - scraper_papa

permissions:
  contents: write

concurrency:
  group: monitor-sodre
  cancel-in-progress: false

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl feedparser requests beautifulsoup4 pydantic python-dateutil google-genai

      - name: Ejecutar script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAREA: ${{ inputs.script_a_ejecutar }}
        run: |
          if [ "$TAREA" = "procesar_excel_2025" ]; then
            python procesar_excel_2025.py

          elif [ "$TAREA" = "historico_2026" ]; then
            python historico_2026.py

          elif [ "$TAREA" = "scraper_papa" ]; then
            python scraper_papa.py

          else
            python main.py
          fi

      - name: Guardar resultados de prueba papal
        if: ${{ inputs.script_a_ejecutar == 'scraper_papa' }}
        uses: actions/upload-artifact@v4
        with:
          name: prueba-repercusion-papal
          path: data/menciones_papa_filtradas_2026.csv
          if-no-files-found: error
          retention-days: 14

      - name: Guardar actualizaciones normales
        if: ${{ inputs.script_a_ejecutar != 'scraper_papa' }}
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No hay noticias nuevas."
          else
            git commit -m "chore: actualizar menciones [skip ci]"
            git push origin main
          fi
