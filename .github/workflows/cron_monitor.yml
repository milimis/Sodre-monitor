name: Monitoreo Menciones Sodre

on:
  schedule:
    - cron: '0 12,0 * * *'
  workflow_dispatch:
    inputs:
      script_a_ejecutar:
        description: 'Selecciona la tarea a ejecutar:'
        required: true
        default: 'monitoreo_diario'
        type: choice
        options:
          - 'monitoreo_diario'
          - 'procesar_excel_2025'
          - 'historico_2026'

permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install pandas openpyxl feedparser requests beautifulsoup4 pydantic python-dateutil google-genai

      - name: Ejecutar script seleccionado
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAREA: ${{ github.event.inputs.script_a_ejecutar }}
        run: |
          if [ "$TAREA" = "procesar_excel_2025" ]; then
            echo "Procesando Excel de 2025..."
            python procesar_excel_2025.py
          elif [ "$TAREA" = "historico_2026" ]; then
            echo "Recuperando historico 2026..."
            python historico_2026.py
          else
            echo "Ejecutando monitoreo diario..."
            python main.py
          fi

      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name "actions-user"
          git config --global user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No hay menciones nuevas para guardar."
          else
            git commit -m "chore: actualizacion automatica menciones [skip ci]"
            git push origin main
          fi
