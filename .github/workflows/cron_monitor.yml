name: Monitoreo Menciones Sodre

on:
  # Se ejecuta automáticamente todos los días a las 09:00 y 21:00 (hora Uruguay)
  schedule:
    - cron: '0 12,0 * * *'
  # Permite ejecución manual eligiendo qué tarea correr
  workflow_dispatch:
    inputs:
      script_a_ejecutar:
        description: 'Selecciona la tarea a ejecutar:'
        required: true
        default: 'Monitoreo diario 2026 (main.py)'
        type: choice
        options:
          - 'Monitoreo diario 2026 (main.py)'
          - 'Scraper Web Sodre 2025 (scraper_sodre_web_2025.py)'
          - 'Historico 2025 (historico_2025.py)'
          - 'Historico 2026 completo (historico_2026.py)'
          - 'Procesar Excel 2025 (procesar_excel_2025.py)'

permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar script seleccionado
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.script_a_ejecutar }}" = "Scraper Web Sodre 2025 (scraper_sodre_web_2025.py)" ]; then
            echo "Extrayendo directamente de sodre.gub.uy/prensa 2025..."
            python scraper_sodre_web_2025.py
          elif [ "${{ github.event.inputs.script_a_ejecutar }}" = "Historico 2025 (historico_2025.py)" ]; then
            echo "Ejecutando recopilación histórica 2025..."
            python historico_2025.py
          elif [ "${{ github.event.inputs.script_a_ejecutar }}" = "Historico 2026 completo (historico_2026.py)" ]; then
            echo "Ejecutando recopilación histórica 2026..."
            python historico_2026.py
          else
            echo "Ejecutando monitoreo diario en curso (main.py)..."
            python main.py
          fi

      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name "actions-user"
          git config --global user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No hay menciones nuevas para guardar."
          else
            git commit -m "chore: actualización automática menciones [skip ci]"
            git push origin main
            elif [ "${{ github.event.inputs.script_a_ejecutar }}" = "Procesar Excel 2025 (procesar_excel_2025.py)" ]; then
          echo "Procesando Excel oficial 2025..."
          python procesar_excel_2025.py
          fi
